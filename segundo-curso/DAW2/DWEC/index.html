<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow:wrap;
            
        }

        div{
            width: 200px;
            height: 200px;
            background-color: salmon;
            border:solid 10px white;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
            font-size: 5rem;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px #000000;
            overflow: hidden;
        }

        div::before{
            content: "+";
            position:relative;
            top:100%;
        }

        div:hover::before{
            top:0%;
        }
        
        *{
            transition: all .5s;
            /* transition: all .5s; */
        }
        
        #c1{
            background:url("https://picsum.photos/400") center center no-repeat;
        }
        
        #c1:hover{
            background-position: 50% 0%;
        }    



    </style>
</head>
<body>
