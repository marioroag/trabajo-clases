<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pactómetro ficticio</title>
</head>

<body>
    <h1>Pactómetro electoral 2026 (simulación)</h1>
    <p>Los escaños de los escenarios son inventados. Elige entre 1 y 3 partidos.</p>

    <form method="post" action="analizarPacto.php">
        <!-- select → un valor: sierra | costa | vega -->
        <label for="escenario">Escenario:</label>
        <select name="escenario" id="escenario" required>
            <option value="sierra">Asamblea de Sierra (41)</option>
            <option value="costa">Asamblea de Costa (51)</option>
            <option value="vega">Asamblea de Vega (61)</option>
        </select>
        <br><br>

        <!-- name="socios[]" → en PHP llega un array de lo marcado -->
        <p>Partidos del pacto (1 a 3):</p>
        <label><input type="checkbox" name="socios[]" value="PSOE"> PSOE</label><br>
        <label><input type="checkbox" name="socios[]" value="PP"> PP</label><br>
        <label><input type="checkbox" name="socios[]" value="Vox"> Vox</label><br>
        <label><input type="checkbox" name="socios[]" value="Sumar"> Sumar</label><br>
        <label><input type="checkbox" name="socios[]" value="Podemos"> Podemos</label><br>
        <br>

        <button type="submit">Analizar pacto</button>
    </form>
</body>

</html>
