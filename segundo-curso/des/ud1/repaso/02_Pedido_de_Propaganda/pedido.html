<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pedido electoral</title>
</head>

<body>
    <h1>Pedido de material de campaña (simulación)</h1>
    <form method="post" action="procesarPedido.php">
        <label for="partido">Partido:</label>
        <select id="partido" name="partido" required>
            <option value="PSOE">PSOE</option>
            <option value="PP">PP</option>
            <option value="Vox">Vox</option>
            <option value="Sumar">Sumar</option>
            <option value="Podemos">Podemos</option>
        </select>
        <!-- TODO: radios obligatorios name="pack": basico, movil, completo -->
        <fieldset>
            <legend>Pack:</legend>
            <label class="opcion"><input type="radio" name="pack" value="basico" required> Basico</label>
            <label class="opcion"><input type="radio" name="pack" value="movil"> Movil</label>
            <label class="opcion"><input type="radio" name="pack" value="completo"> Completo</label>
        </fieldset>
        <!-- TODO: número entero name="unidades", mínimo 1 y máximo 8 -->
        <div>
            <label for="unidades">Unidades: </label>
            <input type="number" id="unidades" name="unidades" min="1" max="8" step="1">
        </div>
        <!-- TODO: checkboxes name="extras[]": chapas, pegatinas, lanyards, folletos -->
        <fieldset>
            <legend>Extras:</legend>
            <label class="opcion"><input type="checkbox" name="extras[]" value="chapas"> Chapas</label>
            <label class="opcion"><input type="checkbox" name="extras[]" value="pegatinas"> Pegatinas</label>
            <label class="opcion"><input type="checkbox" name="extras[]" value="lanyards"> Lanyards</label>
            <label class="opcion"><input type="checkbox" name="extras[]" value="folletos"> Folletos</label>
        </fieldset>
        <!-- TODO: radios obligatorios name="transporte": recogida, normal, urgente -->
        <fieldset>
            <legend>Pack:</legend>
            <label class="opcion"><input type="radio" name="transporte" value="urgente" required> Urgente</label>
            <label class="opcion"><input type="radio" name="transporte" value="normal"> Normal</label>
            <label class="opcion"><input type="radio" name="transporte" value="recogida"> Urgente</label>
        </fieldset>
        <!-- TODO: campo de texto opcional name="codigo" (LOCAL2026 o VOLUNTARIADO) -->
        <div class="campo">
            <label for="codigo">Codigo</label>
            <input type="text" id="codigo" name="codigo" maxlength="50" placeholder="Código de promoción">
        </div>
        <button type="submit">Calcular pedido</button>
    </form>
</body>

</html>
