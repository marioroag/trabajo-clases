<!--
  EJERCICIO 04 · Formulario IMC
  Campos: nombre, edad, altura (cm), peso (kg) → POST a porcesarIMC.php
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora IMC</title>
</head>

<body>

    <h1>Calculadora de IMC</h1>

    <form action="porcesarIMC.php" method="POST">
        <!-- name = clave en $_POST['nombre'] -->
        <label for="nombre">Nombre (1–20 caracteres)</label>
        <input name="nombre" id="nombre" type="text" maxlength="20" required>
        <br>

        <label for="edad">Edad (0–130)</label>
        <input name="edad" id="edad" type="number" min="0" max="130" required>
        <br>

        <label for="altura">Altura en cm (50–300)</label>
        <input name="altura" id="altura" type="number" min="50" max="300" required>
        <br>

        <!-- step="0.1" permite decimales (ej. 72.5) -->
        <label for="peso">Peso en kg (20–500)</label>
        <input name="peso" id="peso" type="number" min="20" max="500" step="0.1" required>
        <br>

        <input type="submit" value="Calcular">
    </form>

</body>

</html>
