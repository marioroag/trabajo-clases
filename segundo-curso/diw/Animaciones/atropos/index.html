<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.css" />

    <style>
        .my-atropos {
            width: 320px;
            height: 160px;
            background-color: crimson;
        }
    </style>

</head>

<body>
    <div class="atropos">
        <div class="atropos-scale">
            <div class="atropos-rotate">
                <div class="atropos-inner">
                        <!--
                        Element with negative offset will move in reverse direction,
                        making it appear behind the scene
                        -->
                    <img src="image-emily.jpg" data-atropos-offset="-5" />
                        <!--
                        Element with no offset will not move
                        -->
                    <img src="logo.svg" data-atropos-offset="0" />
                        <!--
                        Element with positive offset will move in same direction,
                        making it appear in front of the scene
                        -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // import Atropos library
        import Atropos from 'https://cdn.jsdelivr.net/npm/atropos@2/atropos.min.mjs';


        const myAtropos = Atropos({
            el: '.my-atropos',
            activeOffset: 40,
            shadowScale: 1.05,
            onEnter() {
                console.log('Enter');
            },
            onLeave() {
                console.log('Leave');
            },
            onRotate(x, y) {
                console.log('Rotate', x, y);
            }
        });
    </script>
</body>

</html>
