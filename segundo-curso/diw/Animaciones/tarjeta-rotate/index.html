<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        body {
            height: 97vh;
            perspective: 1000px;
            align-content: center;
        }

        .hitbox {
            margin: auto;
            position: relative;

            width: 300px;
            height: 400px;
        }

        .hitbox:hover .card {
            transform: rotateY(180deg);
        }
        
        .card {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.75);
            border: 2px solid black;
            transform-style: preserve-3d;

            transition: transform 1s;

            cursor: pointer;
        }

        div {
            align-content: center;
            text-align: center;
            font-size: 8rem;
            inset: 0;

            position: absolute;
        }

        .caraA {
            background-color: crimson;
            backface-visibility: hidden;
            z-index: 1;
        }

        .caraB {
            background-color: dodgerblue;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="hitbox">
        <div class="card">
            <div class="caraA">A</div>
            <div class="caraB">B</div>
        </div>
    </div>
</body>
</html>
