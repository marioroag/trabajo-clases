<script>
    // 5.- Calculadora de temperatura media. El programa debe pedir la temperatura de la semana (7 días) y calcular la temperatura promedio. Se deben descartar los valores fuera del rango (-20 y 50).

    // Ejemplo:


    // Introduce la temperatura del día 1: 32
    // Introduce la temperatura del día 2: 31
    // Introduce la temperatura del día 3: 28.5
    // Introduce la temperatura del día 4: 82
    // Temperatura incorrecta. Debe estar entre -20 y 50
    // Introduce la temperatura del día 4: 12
    // Introduce la temperatura del día 5: 33
    // Introduce la temperatura del día 6: 35
    // Introduce la temperatura del día 7: 65
    // Temperatura incorrecta. Debe estar entre -20 y 50

    // Declaraciones
    const SEMANA = 7
    let temperaturaDia = 0
    let temperaturaTotal = 0

    // Se hace el bucle 7 veces
    for (let i = 1; i <= SEMANA; i++) {
        // Suma y recuerda las temperaturas para despues hacer la media
        temperaturaDia = (Number(prompt('Introduce la temperatura del día ' + i + ': ')))
        temperaturaTotal+= temperaturaDia

        // -======== SIGUE PREGUNTANDO HASTA QUE SE INTRODUZCA UN RANGO VALIDO ========-
        while (temperaturaDia <= -20 || temperaturaDia >= 50) {
            alert('Temperatura incorrecta. Debe estar entre -20 y 50')
            temperaturaDia = (Number(prompt('Introduce la temperatura del día ' + i + ': ')))
        }
    }

    // Formula:
    let temperaturaSemana = temperaturaTotal / 7

    // Resultado:
    console.log('La temperatura media de la semana ha sido: ' + temperaturaSemana.toFixed(2));
    
</script>
