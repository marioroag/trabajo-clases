<script>
    // 3. Dividir cuentas y calcular propinas

    // Crea un programa para dividir cuentas y calcular propinas. El programa debe pedir productos de una cuenta hasta que el usuario introduce un 0.
    // Luego pide el número de personas y el porcentaje de propina que quieren dejar. Calcula el total con propina y cuánto debe pagar cada persona.

    // Ejemplo:

    // Precio del producto 1: 10
    // Precio del producto 2: 20
    // Precio del producto 3: 15
    // Precio del producto 4: 35
    // Precio del producto 5: 0

    // ¿Cuánta propina quieres dejar?: 5
    // ¿Cúantas personas sois?: 4

    // Total sin propina: 80€
    // Total con propina del 5%: 84€

    // Precio por cabeza: 21€

    // Variables:
    let producto = 0
    let numeroProducto = 1
    let porcentajePropina = 0
    let personas = 0
    let propina = 0
    let totalCuenta = 0
    let totalCabeza = 0
    let totalConPropina

    let precioValido = true

    producto = Number(prompt('Precio del producto 1:'))

    // Bucle que suma productos hasta que introduzca 0:
    while (producto != 0 & precioValido) {
        totalCuenta += producto
        numeroProducto++
        producto = Number(prompt('Precio del producto ' + numeroProducto + ':'))
    }

    // Solicitud de datos para las formulas
    porcentajePropina = Number(prompt('¿Cuánta propina quieres dejar?:'))
    personas = Number(prompt('¿Cúantas personas sois?:'))

    // Calculo:
    propina = (totalCuenta * porcentajePropina) / 100
    totalConPropina = totalCuenta + propina

    totalCabeza = totalConPropina / personas

    // Resultado en consola:
    console.log('Total sin propina: ' + totalCuenta.toFixed(2) + '€');
    console.log('Total con propina del ' + porcentajePropina.toFixed(2) + '%: ' + totalConPropina + '€');
    console.log('Precio por cabeza: ' + totalCabeza.toFixed(2) + '€');
</script>
