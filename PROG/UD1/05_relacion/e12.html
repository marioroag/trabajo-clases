<script>
    // Solicitar un número entero. Mostrar el siguiente número múltiplo de 2 a partir del número.
    let numero = Number(prompt('Introduzca un numero entero'))
    numero++ // Siguiente

    while (numero % 2 != 0) { // Busca multiplo del 3
        numero++
    }

    console.log('Siguiente multiplo de 2: ' + numero)

</script>
