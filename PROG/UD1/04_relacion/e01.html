<script>
    /* Escribe un programa que pida al usuario un número entero positivo y muestre la tabla de multiplicar de ese número (del 1 al 10) usando un bucle for
    👉 Ejemplo de salida si el usuario introduce 3:

    3 x 1 = 3  
    3 x 2 = 6  
    3 x 3 = 9  
    ...  
    3 x 10 = 30  

    */
    let numero = parseInt(prompt('Número para saber la tabla de multiplicar'))
    console.log('Tabla de multiplicar de ' + numero + ':')
    let multiplicador = 1
    let resultado = 0

    for (let i = 1; i < 10; i++) {
        resultado = numero * i
        console.log(numero + ' x ' + multiplicador + ' = ' + resultado)
    }
</script>
