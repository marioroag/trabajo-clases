<script>
    /* 16. Calculadora de impuestos progresivos:
    Pide al usuario su salario anual e imprime el impuesto a pagar según estos tramos:
        Menos de 10.000€: 0% de impuestos.
        De 10.000€ a 20.000€: 10%.
        De 20.000€ a 40.000€: 20%.
        Más de 40.000€: 30%. */
    
    // Solicita al usuario su salario anual
    let salario = Number(prompt('Ingrese su salario anual €'))

    // Define los rangos de salario segun el nivel de impuestos
    let sinImpuestos = salario < 10000
    let bajos = salario >= 10000 && salario < 20000
    let medios = salario >= 20000 && salario < 40000
    let altos = salario > 40000

    let impuestos

    // Fórmula calcular impuestos: ((Cantidad \* Porcentaje) / 100)
    //let pagara = salario - ((salario * impuestos) / 100)

    if (sinImpuestos) {
        console.log('Pagarás 0€ en impuestos')
    } else if (bajos) {
        impuestos = 10
    } else if (medios) {
        impuestos = 20
    } else if (altos) {
        impuestos = 30
    } else {
        console.log ('Error')
    }

    let impuestosPagar = (salario * impuestos) / 100
    let resultadoDinero = salario - ((salario * impuestos) / 100)
    console.log('Pagarás ' + impuestosPagar + '€ en impuestos, dejandote un salario anual de: ' + resultadoDinero)
</script>
