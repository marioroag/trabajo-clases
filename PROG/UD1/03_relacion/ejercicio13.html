<script>
    // 13. Determinar si un carácter es vocal o consonante:
    // Pide una letra al usuario e indica si es una vocal (a, e, i, o, u) o una consonante.

    // Solicita una letra al usuario
    let letra = prompt('Ingrese una letra (minúscula)')
    // Convierte entrada del usuario a minuscula para asegurarse de poder trabajar con su input
    letra = letra.toLocaleLowerCase()

    // Definiciones:
    let vocal = (letra == 'a' || letra == 'e' || letra == 'i' || letra == 'o' || letra == 'u')

    // Si es vocal, else
    if (vocal) {
        console.log('Vocal')
    } else {
        console.log('Consonante')
    }
</script>
