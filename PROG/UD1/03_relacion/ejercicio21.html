<script>
    /* 21. Sistema de clasificación de IMC:
    Pide el peso y la altura del usuario para calcular el IMC, luego clasifica en:
    Bajo peso (IMC < 18.5).
    Normal (IMC entre 18.5 y 24.9).
    Sobrepeso (IMC entre 25 y 29.9).
    Obesidad (IMC >= 30). */

    // Peso y altura del usuario:
    let peso = Number(prompt('Peso (kg):'))
    let altura = Number(prompt('Altura (m):'))

    // Calcula IMC:
    let imcEntero = peso / (altura*altura)
    let imc = imcEntero.toFixed(1)
    
    // Lógica
    
    if (imcEntero < 18.5) {
        console.log('Con un IMC de ' + imc + ', entras en la clasificación de "Bajo Peso"')
    } else if (imcEntero >= 18.5 && imcEntero < 25) {
        console.log('Con un IMC de ' + imc + ', entras en la clasificación de "Normal"')
    } else if (imcEntero >= 25 && imcEntero < 30) {
        console.log('Con un IMC de ' + imc + ', entras en la clasificación de "Sobrepeso"')
    } else {
        console.log('Con un IMC de ' + imc + ', entras en la clasificación de "Obesidad"')
    }
</script>
