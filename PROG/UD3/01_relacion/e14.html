<script>
    /* 14. Calcular el promedio de un array
    rea una función llamada promedioArray que reciba un array de números y devuelva su promedio. */

    function promedioArray(array) {
        let suma = 0
        for (let i = 0; i < array.length; i++) {
            suma += array[i]
        }
        let promedio = (suma / array.length)
        return promedio
    }

    //////////////
    // MAIN //////
    //////////////

    let numeros = []
    const TAMANIOARRAY = 5

    for (let i = 0; i < TAMANIOARRAY; i++) {
        numeros.push(Math.floor(Math.random() * 20))
    }

    alert('Original: ' + numeros);
    alert('Modificado: ' + promedioArray(numeros));
</script>
