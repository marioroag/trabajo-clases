<script>
    // 2. Suma de dos números
    // Crea una función llamada sumar que reciba dos números y devuelva su suma.

    function sumar(sumando1, sumando2) {
        return sumando1 + sumando2
    }

    //////////////
    // MAIN //////
    //////////////

    let sumando1 = Number(prompt('Primer numero a sumar'))
    let sumando2 = Number(prompt('Segundo numero a sumar'))

    console.log(sumar(sumando1, sumando2));
    
</script>
