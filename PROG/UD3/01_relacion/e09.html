<script>
    // 9. Obtener el menor de tres números
    // Crea una función llamada menorDeTres que reciba tres números y devuelva el menor de los tres

function menorDeTres(num1, num2, num3) {
    let numeros = [num1, num2, num3]
    let actualMenor = 0

    for (let i = 0; i < numeros.length; i++) {
        if (i == 0 ) actualMenor = numeros[i]
        if (numeros[i] < actualMenor) actualMenor = numeros[i]
    }

    return actualMenor
}

    //////////////
    // MAIN //////
    //////////////

    let numUser1 = Number(prompt('Primer numero'))
    let numUser2 = Number(prompt('Segundo numero'))
    let numUser3 = Number(prompt('Tercer numero'))

    console.log(menorDeTres(numUser1, numUser2, numUser3));
</script>
