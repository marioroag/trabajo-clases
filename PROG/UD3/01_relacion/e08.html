<script>
    // 8. Encontrar el número mayor
    // Crea una función llamada mayor que reciba dos números y devuelva el mayor de los dos

function mayor(num1, num2) {
    let resultado = false

    if (num1 > num2) {
        resultado = num1
    } else if (num2 > num1) {
        resultado = num2
    } else {
        resultado = 'Los números introducidos son iguales'
    }

    return resultado
}

    //////////////
    // MAIN //////
    //////////////

    let numUser1 = Number(prompt('Primer numero'))
    let numUser2 = Number(prompt('Segundo numero'))

    console.log(mayor(numUser1, numUser2));
</script>
