<script>
    // ### 5. Generar una Lista de 10 Caras o Cruces Aleatorios  
    // Escribe una función llamada `caraOCruz` que devuelva "Cara" o "Cruz" al azar. 
    // Luego, crea otra función llamada `listaCarasOCruces` que use `caraOCruz` 10 veces para generar una lista de 10 resultados de "Cara" o "Cruz".

    function caraOCruz() {
        let arrayResultado = []
        let tirada = Math.floor(Math.random() * 2)
        if (tirada == 0) {
            arrayResultado.push('Cara')
        } else {
            arrayResultado.push('Cruz')
        }
        return arrayResultado
    }

    function listaCarasOCruces() {
        let diezResultados = []
        for (let i = 0; i < 10; i++) {
            diezResultados.push(caraOCruz())
        }
        return diezResultados
    }

    // --------- MAIN -----------
    
    alert(`Lista de resultados:\n\n${listaCarasOCruces().join('\n')}`)
</script>
