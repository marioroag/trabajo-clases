<script>
    /* 16. Verificar si un número está en un array
    Crea una función llamada verificarNumeroEnArray que reciba un número y un array
    y devuelva true si el número está presente en el array o false si no lo está. */

    function verificarNumeroEnArray(numero, array) {
        let estaPresente = false

        for (let i = 0; i < array.length; i++) {
            if (array[i] == numero) {
                estaPresente = true
            }
        }

        return estaPresente
    }

    //////////////
    // MAIN //////
    //////////////

    let array = [5, 10, 15, 20, 25]
    let numero = Math.floor(Math.random() * 25)
    console.log(array);
    console.log(`¿Está el numero ${numero} presente en el array? ${verificarNumeroEnArray(numero, array)}`);
</script>
