<script>
    function citasSolapadas(inicioCita1, finCita1, inicioCita2, finCita2) {
        let citasCompatibles = false

        if (inicioCita2 > finCita1 && inicioCita2 > inicioCita1 && inicioCita1 < finCita1 && inicioCita2 < finCita2) {
            citasCompatibles = true
        }

        return citasCompatibles
    }

    // ============================= MAIN ============================= //

    let seSolapan = citasSolapadas("14:00", "15:30", "15:31", "16:30");

    console.log(seSolapan)
</script>
