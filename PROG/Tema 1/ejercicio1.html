<script>
    //1. Declarar 2 variables llamadas `numero1` y `numero2` pidiendo al usuario que meta su valor.
    let numero1 = Number(prompt('Número 1'))
    let numero2 = Number(prompt('Número 2'))
    //2. Mostrar en la consola el valor de ambas variables
    console.log(numero1 + ', ' + numero2)
    //3. Realizar las siguientes operaciones aritméticas con esas variables
    let sumar = numero1 + numero2
    let restar = numero1 - numero2
    let producto = numero1 * numero2
    let division = numero1 / numero2
    let modulo = numero1 % numero2
    //4. Mostrar el resultado en la consola con un mensaje explicativo:
    console.log('Suma: ' + sumar + ', ' +'Resta: ' + restar + ', ' + 'Producto: ' + producto + ', ' + 'Division: ' + division + ', ' + 'Módulo: ' + modulo)
</script>
