<script>
    // * ### 2. **Calculadora de Propinas**
    // Pide al usuario el total de una cuenta y el porcentaje de propina que quiere dejar. Calcula y muestra la propina. */
    // Defino Variables
    let cuenta = Number(prompt('Cuanto ha sido la cuenta?'))
    let porcentaje = Number(prompt('Que % de propina quieres dejar'))
    let propina = cuenta * (porcentaje/100)

    // Calculo y loggeo en la consola
    console.log('-- Calculadora de propinas --')
    console.log('La propina del ' + porcentaje + '% en la cuenta de ' + cuenta + ' es: ')
    console.log(propina)

</script>
