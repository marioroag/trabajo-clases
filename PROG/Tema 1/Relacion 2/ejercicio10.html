<script>
    // 10. **Convertir Minutos a Horas y Minutos**
    // Pide al usuario una cantidad de minutos
    let minutos = Number(prompt('¿Cuantos minutos quieres pasar a horas?'))

    // Se calculan a horas y minutos (por ejemplo, 150 minutos son 2 horas y 30 minutos).
    let horas = parseInt(minutos/60)
    let sobranteMinutos = minutos%60

    // Log en consola
    console.log(minutos + ' minutos, serían: ' + horas + ' horas y ' + sobranteMinutos + ' minutos') // 2.5
    
</script>
