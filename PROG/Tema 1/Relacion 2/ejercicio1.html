<script>
    // ### 1. **Adivina el Año de Nacimiento**
    //- Pide al usuario su edad y calcula en qué año nació.
    let edad = Number(prompt('Cuantos años tienes?'))
    let anio = 2025
    let anioNacimiento = anio - edad
    console.log('-- Calculadora de año de nacimiento --')
    console.log('Si tienes ' + edad + ' años, significa que naciste en ' + anioNacimiento)
</script>
