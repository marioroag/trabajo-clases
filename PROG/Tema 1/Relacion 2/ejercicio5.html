<script>
    // 5. Calculadora de Peso en la Luna
    // Pide el peso del usuario
    let peso = Number(prompt('¿Cuánto pesas? (kg)'))
    let pesoLunar = peso*(16.5/100)

    // Calcula cuánto pesaría en la Luna y lo loggea.
    console.log('Si pesas ' + peso + 'kg, pesarías ' + pesoLunar + 'kg en la Luna.')
</script>
