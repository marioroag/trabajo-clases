<script>
    // 3. Calcular el promedio de tres números:
    // Solicita tres números y calcula el promedio.

    // Solicita al usuario por 3 números
    let numero1 = Number(prompt('Primer número'))
    let numero2 = Number(prompt('Segundo número'))
    let numero3 = Number(prompt('Tercer número'))
    let promedio = ((numero1 + numero2 + numero3) / 3) // Fórmula para calcular la media

    // Muestra el resultado en la consola
    console.log('El promedio es de ' + promedio)
</script>
