<script>
    // 8. Determinar si un número es positivo, negativo o cero:
    // Solicita un número y determina si es positivo, negativo o cero.

    // Solicito al usuario un número
    let numero = parseFloat(prompt("Ingrese un número:"));
    
    // Compruebo si es positivo, negativo o cero
    if (numero > 0) {
        console.log(numero + ' es un número positivo')
    } else if (numero == 0) {
        console.log('El número ingresado es 0')
    } else if (numero < 0) {
        console.log(numero + ' es un número negativo')
    }
</script>
