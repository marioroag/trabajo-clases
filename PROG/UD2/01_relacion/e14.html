<script>
    // Mover un elemento al final

    // Dado el array numeros = [5, 10, 15, 20]
    // Mueve el primer número al final del array usando shift() y push().
    // Imprime el array después del movimiento.

    let numeros = [5, 10, 15, 20]
    let tmp = numeros.shift()
    numeros.push(tmp)

    console.log(numeros);
</script>
