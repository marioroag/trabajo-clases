<script>
    // Eliminar todos los elementos de un array uno por uno

    // Crea un array con los valores [1, 2, 3, 4, 5].
    // Elimina todos los elementos uno por uno utilizando pop() 
    // Hasta que el array quede vacío.
    // Imprime el estado del array después de cada eliminación.

    let numeros = [1, 2, 3, 4, 5]
    let total = numeros.length
    
    for (let i = 0; i <= total; i++) {
        console.log(numeros);
        numeros.pop()
    }
</script>
