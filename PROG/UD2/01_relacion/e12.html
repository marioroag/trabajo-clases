<script>
    // Eliminar varios elementos del inicio y del final

    // Usando el array nombres del ejercicio anterior, elimina el primer y el último elemento.
    // Imprime el array resultante y los valores eliminados.

    let nombres = ['Ana', 'Pedro']
    nombres.unshift('Carlos')
    nombres.push('Laura')
    console.log(nombres);

    nombres.shift();
    nombres.pop();
    console.log(nombres);
    
</script>
