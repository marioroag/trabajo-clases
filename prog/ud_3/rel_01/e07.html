<script>
    // 7. Juego: Adivina el Número
    // Crea una función juegoAdivinaNumero que genere un número aleatorio entre 1 y 10. 
    // Pídele al usuario que adivine el número, y dile si el número que ingresó es menor, mayor o igual al número generado.

    function numeroAleatorio10() {
        let numero = Math.floor(Math.random() * 10) + 1
        return numero
    }

    function juegoAdivinaNumero(guess, numeroDesconocido) {
        let mensaje = ''
        if (guess > numeroDesconocido) {
            mensaje = 'El número introducido es mayor al numero a adivinar.' 
        } else if (guess < numeroDesconocido) {
            mensaje = 'El número introducido es menor al numero a adivinar.'
        } else {
            mensaje = 'Has adivinado el numero!'
        }
        return mensaje
    }

    let numeroDesconocido = numeroAleatorio10()
    let intento = 0
    let mensaje = ''

    while (mensaje != 'Has adivinado el numero!') {
        intento = Number(prompt('Intenta adivinar el numero:'))
        mensaje = juegoAdivinaNumero(intento, numeroDesconocido)
        console.log(mensaje);
    }
</script>
