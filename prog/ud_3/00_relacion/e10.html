<script>
    // 10. Calcular el área de un triángulo
    // Crea una función llamada areaTriangulo que reciba la base y la altura de un triángulo y 
    // devuelva su área calculada con la fórmula (base * altura) / 2.

function areaTriangulo(base, altura) {
    return (base * altura) / 2
}

    //////////////
    // MAIN //////
    //////////////

    let base = Number(prompt('Base del triangulo:'))
    let altura = Number(prompt('Altura del triangulo:'))
    console.log(areaTriangulo(base, altura));
</script>
