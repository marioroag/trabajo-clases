<script>
    // 4. ¿Es par?
    // Crea una función llamada esPar que reciba un número y devuelva true si es par o false si es impar.

    function esPar(numero) {
        return (numero % 2 == 0)
    }

    //////////////
    // MAIN //////
    //////////////

    let numUser = Number(prompt('Numero para saber si es par:'))
    console.log(esPar(numUser));
</script>
