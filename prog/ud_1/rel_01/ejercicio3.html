<script>
    // ## Ejercicio 3: Cadenas de texto
    // 1. Declaro un saludo y un nombre y los muestro en la consola
    let saludo = 'Hola, '
    let nombre = 'Ana'
    console.log(saludo + nombre + '!')

    // 3. Obtengo la posicion de la letra "a" y la letra que esta en la posicion 0
    let letraAMin = nombre.indexOf('a');

    console.log('Dentro de la variable nombre:')

</script>
