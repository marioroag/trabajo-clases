<script>
    // Solicitar un número entero. Mostrar el siguiente número múltiplo de 2 y 3 a partir del número
    let numero = Number(prompt('Introduzca un numero entero'))
    numero++

    while ((numero % 2 != 0) || (numero % 3 != 0)) { // Mientras no sea multiplo de 2 o de 3
        console.log('Dentro loop: ' + numero);
        numero++
    }

    console.log(numero);
</script>
