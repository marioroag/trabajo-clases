    let numero = parseInt(prompt('Introduzca un numero entero para las filas de la piramide'))
    let espacios
    let asteriscos
    let mensaje = ''

    for (i = 0; i < numero; i++) {
        espacios = ''
        asteriscos = '**'

        for (j = 0; j < numero - i; j++) {
            espacios += ' '
        }
        for (k = 0; k < i*2; k++) {
            asteriscos += '*'
        }

        mensaje = (espacios + asteriscos)
        console.log(mensaje);
    }
