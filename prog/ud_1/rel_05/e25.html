<script>
    // Solicitar un número entero. Dibujar una pirámide con tantas filas como indique el número.
    // Ejemplo:

    //      *
    //     ***
    //    *****
    //   *******
    //  *********
    // ***********

    let numero = parseInt(prompt('Introduzca un numero entero para las filas de la piramide'))
    let mensaje = ''

    // Un bucle que elimina un " " al principio de la linea de codigo hasta llegar a "numero" y luego la inversa, siempre con un "*" asegurado entre los dos
    for (i = 0; numero > i; i++) {
        mensaje = ' '.repeat(numero - i) + '*'.repeat(i) + '*' + '*'.repeat(i)
        console.log(mensaje);
    }
</script>
