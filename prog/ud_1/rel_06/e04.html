<script>
    // 4. Calculadora de combustible

    // Crea un programa que pida una cantidad de litros inicial, un precio por litro y un consumo cada 100 km, 
    // y vaya calculando el precio de cada viaje (pidiendo los kilómetros) y el combustible restante. Si no hay combustible suficiente, debe avisar al usuario.

    // Ejemplo:

    // Introduce el combustible inicial: 50
    // Precio del litro de combustible: 1.45
    // Consumo cada 100km: 5.6

    // Introduce los kilómetros del viaje 1: 50
    // Precio del viaje: 4.06€
    // Combustible restante: 47.2 litros

    // Introduce los kilómetros del viaje 2: 200
    // Precio del viaje: 16.24€
    // Combustible restante: 36 litros

    // Introduce los kilómetros del viaje 3: 1000
    // ¡Combustible insuficiente!

    // Datos iniciales:
    let combustibleRestante = Number(prompt('Introduce el combustible inicial:'))
    let precioLitro = Number(prompt('Precio del litro de combustible:'))
    let consumoMedio = Number(prompt('Consumo cada 100km:'))

    // Declaraciones:
    let numeroViaje = 1
    let kilometrosViaje = 0
    let consumoViaje = 0
    let precioViaje = 0

    // Calculos:
    let consumoKilometro = consumoMedio / 100
    let precioKilometro = consumoKilometro * precioLitro

    // Hacer bucle mientras haya combustible
    while (combustibleRestante > 0) {
        kilometrosViaje = (Number(prompt('Introduce los kilómetros del viaje ' + numeroViaje + ':')))
        numeroViaje++

        // Formulas:
        precioViaje = precioKilometro * kilometrosViaje
        combustibleRestante -= kilometrosViaje * consumoKilometro

        // Solo muestra resultado si hay combustible, si falta combustible muestra alerta
        if (combustibleRestante > 0) {
            console.log('Precio del viaje: ' + precioViaje.toFixed(2) + '€');
            console.log('Combustible restante: ' + combustibleRestante.toFixed(2) + ' litros');
        } else {
            console.log('¡Combustible insuficiente!');
        }
    }
</script>
