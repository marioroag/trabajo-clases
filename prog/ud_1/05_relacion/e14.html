<script>
    // Solicitar un número entero. Mostrar el siguiente número múltiplo de 5 a partir del número.
    let numero = Number(prompt('Introduzca un numero entero'))
    numero++ // Siguiente

    while (numero % 5) {
        numero++
    }

    console.log('Siguiente multiplo del 5: ' + numero);
    
</script>
