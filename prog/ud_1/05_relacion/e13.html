<script>
    // Solicitar un número entero. Mostrar el siguiente número múltiplo de 3 a partir del número.
    let numero = Number(prompt('Introduzca un numero entero'))
    numero++ // Siguiente

    while (numero % 3 != 0) { // Busca multiplo del 3
        numero++
    }

    console.log('Siguiente multiplo del 3: ' + numero)
</script>
