<script>
    // 5. Calcular el factorial de un número
    // Haz una función llamada factorial que reciba un número y devuelva su factorial calculado de forma iterativa.

function factorial(numero) {
    let calculoFactorial = 1

    for (let i = 1; i <= numero; i++) {
        calculoFactorial *=  i
    }

    return calculoFactorial
}

    //////////////
    // MAIN //////
    //////////////

    let numUser = Number(prompt('Calcula la factorial de:'))
    console.log(factorial(numUser));
</script>
