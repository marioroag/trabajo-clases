<script>
    // 4. Cálculo de Tiempo Restante
    // Pregunta al usuario su edad y calcula cuántos días le quedan para cumplir 80 años (usa una estimación de días).
    let edadUser = Number(prompt('¿Cuantos años tienes?'))
    let edadOchenta = (80 - edadUser)*365
    console.log('Te quedan: ' + edadOchenta + ' días para complir 80 años')
</script>
