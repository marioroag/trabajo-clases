<script>
    // ## Ejercicio 2: Entrada con `prompt()` y conversión
    // 1. Pide al usuario y los muestra en la consola.
    let texto1 = prompt('Ingresa numero 1: ')
    let texto2 = prompt('Ingresa numero 2: ')
    console.log('Concatenacion: ' + texto1 + texto2)

    // 2. Convierte ambos a número y muestra la suma numerica real.
    let numero1 = Number(texto1)
    let numero2 = Number(texto2)
    console.log('Suma numérica real: ' + (numero1 + numero2))
</script>
