<script>
    // 4. Determinar si un número es múltiplo de 5:
    // Solicita un número y determina si es múltiplo de 5.

    // Pregunto al usuario por el número
    let numero = Number(prompt('Tu número a comprobar:'))
    let multiploCinco = numero%5 == 0

    if (multiploCinco) { // Si el resto al dividir entre 5 es == 0 
        console.log(numero + ' es múltiplo de 5')
    } else {
        console.log(numero + ' no es múltiplo de 5')
    }
</script>
