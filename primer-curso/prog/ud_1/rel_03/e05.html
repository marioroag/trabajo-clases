<script>
    // 5. Determinar si un número está en un rango:
    // Solicita un número e indica si está entre 10 y 20 (inclusive).

    // Solicito el número al usuario
    let numero = Number(prompt('Numero a comprobar:'))

    // Comprueba si esta entre 10 y 20
    if (numero >= 10 && numero <= 20) {
        console.log(numero + ' está entre 10 y 20.')
    } else {
        console.log(numero + ' no está entre 10 y 20.')
    }
</script>
